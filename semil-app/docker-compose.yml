# Semil Talent Discovery — Docker Compose
# Production-ready stack: App + PostgreSQL + Redis + MinIO (S3-compatible)
#
# Usage:
#   cp .env.example .env   # then edit .env
#   docker compose up -d
#   docker compose exec app node src/migrate.js
#   docker compose exec app node scripts/seed.js

services:
  # ── Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semil-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://semil:${POSTGRES_PASSWORD:-semil_secret}@postgres:5432/semil
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=semil-files
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - semil-net

  # ── PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    container_name: semil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: semil
      POSTGRES_USER: semil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semil_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semil -d semil"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - semil-net

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: semil-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semil-net

  # ── MinIO (S3-compatible object storage) ──
  minio:
    image: minio/minio:latest
    container_name: semil-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - semil-net

  # ── MinIO bucket init (creates the bucket on first run) ──
  minio-init:
    image: minio/mc:latest
    container_name: semil-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/semil-files;
        mc anonymous set none local/semil-files;
        echo 'Bucket semil-files is ready';
      "
    networks:
      - semil-net

  # ── Nginx reverse proxy (optional, for HTTPS termination) ──
  nginx:
    image: nginx:alpine
    container_name: semil-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - semil-net

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  semil-net:
    driver: bridge
