<title>Semil Talent Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed navy sidebar + sticky top bar + scrolling content; candidate portal swaps to a sidebar-less shell */
:root{--bg:#F3F5F9;--surface:#FFFFFF;--surface2:#F7F9FC;--line:#E1E6EF;--fg:#0E1A33;--muted:#5A6A85;--side:#0B1B3A;--side-fg:#B9C6DE;--blue:#2457D6;--blue-soft:#E7EEFD;--teal:#0F8F84;--teal-soft:#DDF4F1;--ok:#17703A;--ok-bg:#E3F4E9;--warn:#A4580A;--warn-bg:#FCEFD2;--bad:#B3261E;--bad-bg:#FCE6E4;--gray:#4B5A74;--gray-bg:#E9EDF3;--shadow:0 1px 2px rgba(11,27,58,.06);--f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A101D;--surface:#111A2C;--surface2:#16213A;--line:#24324D;--fg:#E5ECF8;--muted:#92A3C0;--side:#070D19;--side-fg:#9FB0CE;--blue:#6B9BFF;--blue-soft:#172750;--teal:#3DD5C5;--teal-soft:#0F3A3A;--ok:#6EDC96;--ok-bg:#12351F;--warn:#F2B35E;--warn-bg:#3A2A0C;--bad:#FF8A80;--bad-bg:#3E1714;--gray:#A9B8D2;--gray-bg:#1D2A44;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A101D;--surface:#111A2C;--surface2:#16213A;--line:#24324D;--fg:#E5ECF8;--muted:#92A3C0;--side:#070D19;--side-fg:#9FB0CE;--blue:#6B9BFF;--blue-soft:#172750;--teal:#3DD5C5;--teal-soft:#0F3A3A;--ok:#6EDC96;--ok-bg:#12351F;--warn:#F2B35E;--warn-bg:#3A2A0C;--bad:#FF8A80;--bad-bg:#3E1714;--gray:#A9B8D2;--gray-bg:#1D2A44;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:650}h2{font-size:15px;font-weight:650}h3{font-size:13px;font-weight:650}
a{color:var(--blue)}
.app{display:flex;height:100%}
.side{width:236px;flex:none;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff}
.logo{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-weight:700;color:#fff}
.brand b{display:block;font-size:14px;line-height:1.1}.brand small{color:var(--side-fg);font-size:11px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--side-fg);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--blue);color:#fff}
.nav svg,.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .grow{flex:1}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;width:320px;max-width:100%}
.gsearch input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.content{padding:20px;overflow-y:auto;flex:1}
.demo{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:6px 20px;border-bottom:1px solid var(--line)}
.crumbs{color:var(--muted);font-size:12px;margin-bottom:6px}
.pghead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.pghead p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card>h2{margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi small{color:var(--muted);display:block;font-size:12px}.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.c-gray{background:var(--gray-bg);color:var(--gray)}.c-blue{background:var(--blue-soft);color:var(--blue)}.c-green{background:var(--ok-bg);color:var(--ok)}.c-amber{background:var(--warn-bg);color:var(--warn)}.c-red{background:var(--bad-bg);color:var(--bad)}.c-teal{background:var(--teal-soft);color:var(--teal)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
th[data-sort]{cursor:pointer}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--surface2)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:550;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
.err{color:var(--bad);font-size:12px}.hint{font-size:12px;color:var(--muted)}
input.bad,select.bad,textarea.bad{border-color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.form .full{grid-column:1/-1}
.sec{margin:18px 0 8px;font-weight:650;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 56px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--blue)}
.bar .t i.tl{background:var(--teal)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv small{display:block;color:var(--muted);font-size:12px}
.list{display:grid;gap:0}.list>div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.list>div:last-child{border:0}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:none;width:230px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px}
.col h3{display:flex;justify-content:space-between;padding:2px 4px 8px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;display:grid;gap:4px}
.kc b{font-size:13px;cursor:pointer}
.modalbg{position:fixed;inset:0;background:rgba(7,13,25,.55);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);max-height:92%;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal>div{padding:16px 18px;overflow-y:auto}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:40}
.toast{background:var(--side);color:#fff;padding:10px 14px;border-radius:8px;max-width:340px;border-left:4px solid var(--teal)}
.toast.e{border-color:#ff8a80}
.menu{position:absolute;right:20px;top:54px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:230px;padding:6px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--surface2)}.menu .lb{font-size:11px;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
.menu button.cur{color:var(--blue);font-weight:650}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:650;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;overflow-x:auto}
.cal>div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:110px}
.cal h3{font-size:12px;color:var(--muted);margin-bottom:6px}
.ev{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:4px 6px;font-size:12px;margin-bottom:4px}
.ev.x{background:var(--gray-bg);color:var(--gray);text-decoration:line-through}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.opt{display:flex;gap:8px;align-items:center;margin:5px 0}.opt input[type=radio],.opt input[type=checkbox]{width:auto}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--surface2),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
.burger{display:none}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.pshell{max-width:980px;margin:0 auto}
@media(max-width:900px){.side{position:fixed;left:-250px;top:0;bottom:0;z-index:25;transition:left .2s}.side.open{left:0}.burger{display:inline-flex}.gsearch{width:auto;flex:1}.content{padding:14px}.top{padding:8px 12px}.hide-s{display:none}}
/* ---- journey, portal, secure test ---- */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-18}}
@keyframes beat{50%{transform:scale(1.2)}}
@keyframes glow{50%{opacity:.55}}
@keyframes ray{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes bub{0%,8%{opacity:0;transform:translateY(8px)}20%,70%{opacity:1;transform:none}90%,100%{opacity:0}}
@keyframes letter{from{transform:translateY(10px)}to{transform:translateY(-12px)}}
@keyframes fall{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),96px);opacity:0}}
@keyframes ringfill{to{stroke-dashoffset:var(--o)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(36,87,214,.45)}100%{box-shadow:0 0 0 12px rgba(36,87,214,0)}}
.dr{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s var(--d,.2s) forwards}
.jcard{padding:18px 8px 10px;overflow:hidden}
.jr{position:relative}
.jr ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));position:relative}
.jr .trk{position:absolute;left:calc(100%/16);right:calc(100%/16);top:16px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.jr .trk i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));transform-origin:left;transform:scaleX(var(--f));animation:growx 1.2s cubic-bezier(.2,.7,.2,1) both}
.jr li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:100%;padding:0 2px}
.jr li button:focus-visible .nd{outline:2px solid var(--blue);outline-offset:3px}
.jr .nd{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;animation:pop .5s calc(var(--i)*110ms) both}
.jr .nd .ic{width:18px;height:18px;stroke-width:3}
.jr li.done .nd{background:var(--blue);border-color:var(--blue);color:#fff}
.jr li.cur .nd{border-color:var(--blue);color:var(--blue);animation:pop .5s calc(var(--i)*110ms) both,ping 1.8s 1s infinite}
.jr li.stop .nd{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.jr .nl b{display:block;font-size:12px;line-height:1.2;color:var(--fg)}
.jr .nl small{display:block;color:var(--muted);font-size:11px}
.jr li.up .nl b{color:var(--muted);font-weight:550}
.jr li.sel .nl b{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin:14px 0;align-items:start}
.side2{display:grid;gap:14px}
.sp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;animation:rise .5s both}
.sp h2{font-size:18px}.sp h3{margin:14px 0 4px}
.sp p{margin:6px 0;color:var(--muted)}
.ill{background:var(--blue-soft);border-radius:14px;aspect-ratio:1;align-self:start;display:grid;place-items:center;overflow:hidden}
.ill.is-done{background:var(--teal-soft)}
.il{width:100%;height:100%;padding:12px;overflow:visible}
.il .s{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.il .s2{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.il .f{fill:var(--surface);stroke:var(--blue);stroke-width:3;stroke-linejoin:round}
.il .f2{fill:var(--teal-soft);stroke:var(--teal);stroke-width:3;stroke-linejoin:round}
.il .ln{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s var(--d,.2s) forwards}
.il .bar{stroke-dasharray:var(--w);stroke-dashoffset:var(--w);animation:draw .8s var(--d,.1s) forwards}
.il .hand{transform-box:view-box;transform-origin:90px 88px;animation:spin 6s linear infinite}
.il .mv{stroke-dasharray:4 5;animation:march 1.2s linear infinite}
.il .n1,.il .n2,.il .n3,.il .n4{transform-box:fill-box;transform-origin:center;animation:pop .5s both}
.il .n2{animation-delay:.15s}.il .n3{animation-delay:.3s}.il .n4{animation-delay:.45s}
.il .pulse{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
.il .glow{animation:glow 2s ease-in-out infinite}
.il .ray{animation:ray 1.6s var(--d,0s) ease-in-out infinite}
.il .up{animation:bob 1.4s ease-in-out infinite}
.il .b1{animation:bub 4s ease-in-out infinite}
.il .b2{animation:bub 4s 1.6s ease-in-out infinite}
.il .letter{animation:letter 2.4s ease-in-out infinite alternate}
.il .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s both}
.il .cf{animation:fall 2.4s var(--d,0s) ease-in infinite}
.ck,.cl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:7px}
.ck li,.cl li{display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.ck li span,.cl li span{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.ck li.on span,.cl li.on span{background:var(--teal);border-color:var(--teal);color:#fff;animation:pop .4s calc(var(--j,0)*120ms) both}
.ck .ic,.cl .ic{width:12px;height:12px;stroke-width:3.5}
.cl li:not(.on){color:var(--muted)}
.tp{margin:6px 0 0;padding-left:18px;color:var(--muted);display:grid;gap:3px}
.na{background:var(--blue-soft);border-radius:10px;padding:12px 14px;margin:12px 0;display:grid;gap:6px;animation:rise .5s .15s both}
.na.ok{background:var(--ok-bg)}.na.bad{background:var(--bad-bg)}.na.quiet{background:var(--surface2);border:1px solid var(--line)}
.na p{margin:0}
.na .row{margin-top:2px}
.ring{position:relative;width:84px;height:84px;margin:6px 0 10px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.rb{fill:none;stroke:var(--line);stroke-width:7}
.rf{fill:none;stroke:var(--teal);stroke-width:7;stroke-linecap:round;stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:ringfill 1.2s .2s forwards}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.tl{list-style:none;margin:8px 0 0;padding:0;display:grid}
.tl li{display:flex;gap:12px;padding:8px 0;position:relative;animation:rise .4s calc(var(--i)*80ms) both}
.tl li::before{content:"";position:absolute;left:5px;top:22px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--teal);margin-top:4px;flex:none;position:relative;z-index:1}
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.pct{font-weight:700;font-size:22px;color:var(--teal);font-variant-numeric:tabular-nums}
.ptabs .badge{background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:6px}
.meter{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s}
.drop{border:2px dashed var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
.drop:hover{border-color:var(--blue)}
.uprog{margin-top:8px}
.receipt{display:flex;gap:12px;align-items:center;background:var(--ok-bg);padding:10px 12px;border-radius:10px;margin-bottom:8px}
.ic.big{width:34px;height:34px;stroke:var(--ok);stroke-width:3}
.steps4{display:flex;gap:8px;margin-top:12px}
.steps4 span{flex:1;text-align:center;padding:6px;border-radius:8px;background:var(--gray-bg);color:var(--gray);font-weight:600;font-size:12px}
.steps4 .on{background:var(--ok-bg);color:var(--ok)}.steps4 .cur{background:var(--blue-soft);color:var(--blue)}
.tc{margin-bottom:10px}
.lockpill{display:inline-flex;gap:6px;align-items:center;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-top:4px}
.lockpill .ic{width:14px;height:14px}
.secure{min-height:100%}
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tbar .tt{flex:1;min-width:140px}
.timer.low{color:var(--bad);display:inline-block;animation:beat 1s infinite}
.pager{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pg{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg.ans:not(.on){background:var(--teal-soft);border-color:var(--teal)}
.qcard{animation:rise .35s both}
.opt.big{padding:11px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;margin:8px 0}
.opt.big:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.pre,.blk{max-width:700px;margin:16px auto;display:grid;gap:12px}
.lockico{width:76px;height:76px}
.lockico svg{width:100%;height:100%}
.lockico .f{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2.5}
.lockico .s{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round}
.lockico .f2{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2.5}
.lockico .s2{fill:none;stroke:var(--teal);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.lockico .f.bad{fill:var(--bad-bg);stroke:var(--bad)}.lockico .s.bad{stroke:var(--bad)}
.lockico .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s both}
.lockico.shake{animation:shake .6s .1s both}
.rules{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rules ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.sc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.sc li{display:flex;gap:8px;align-items:center;animation:rise .4s calc(var(--j)*200ms + .2s) both}
.sc li span{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.sc li.no span{background:var(--warn)}
.sc .ic{width:12px;height:12px;stroke-width:3.5}
.ack{margin:4px 0}
@media(max-width:900px){.jgrid{grid-template-columns:1fr}}
@media(max-width:700px){

function field(l,id,o){o=o||{};const v=o.v==null?'':o.v,r=o.req?' *':'';let inp;
 if(o.opts)inp=`<select id="${id}">${o.opts.map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${esc(a[0])}"${String(a[0])===String(v)?' selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
 else if(o.ta)inp=`<textarea id="${id}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`;
 else if(o.file)inp=`<input id="${id}" type="file" ${o.acc?`accept="${o.acc}"`:''}>`;
 else inp=`<input id="${id}" type="${o.type||'text'}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.ro?'readonly':''}>`;
 return`<label class="f ${o.full?'full':''}">${esc(l)}${r}${inp}<span class="err" id="${id}_e"></span>${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</label>`}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

 const cnt=f=>c.filter(f).length,iv=D.interviews.filter(i=>i.status==='Scheduled');
 const k=[['Total candidates',n],['New applications',cnt(x=>x.stage==='Applied')],['In assessment',cnt(x=>/^Round/.test(x.stage))],['Shortlisted',cnt(x=>decision(x)==='Shortlisted')],['Awaiting review',cnt(x=>x.submitted)],['Active vacancies',D.vacancies.filter(v=>v.status==='Active').length],['Interviews scheduled',iv.length],['Selected',cnt(isSel)],['Pending offers',cnt(x=>x.stage==='Selected'||x.stage==='Offer Sent')],['Joining confirmations',cnt(x=>x.stage==='Offer Accepted'||x.stage==='Joined')],['Blocked tests',blockedList().length]];

 const byRole=ROLES.map(r=>[r.name.replace(/ \(.*\)/,''),cnt(x=>x.role===r.id)]),byCol=COLLEGES.map(x=>[x,cnt(y=>y.college===x)]).filter(x=>x[1]);
 const pass=[0,1,2,3,4].map(i=>{const s=c.filter(x=>x.scores[i]!=null);const p=s.filter(x=>x.scores[i]>=state.cfg.t[i]).length;return['R'+(i+1)+' '+ROUNDS[i].split(' ')[0],s.length?Math.round(p/s.length*100):0,s.length?Math.round(p/s.length*100)+'%':'n/a']});
 const comp=[1,2,3,4,5].map(i=>{const r=cnt(x=>reached(x)>=i),d=cnt(x=>x.scores[i-1]!=null);return['R'+i+' '+ROUNDS[i-1].split(' ')[0],r?Math.round(d/r*100):0,r?Math.round(d/r*100)+'%':'n/a']});
 const over=c.filter(x=>x.submitted&&x.subDays>3);
 return head('Dashboard','Executive overview of the Bengaluru campaign',`<button class="btn" data-a="go" data-v="candnew">Add candidate</button><button class="btn" data-a="newvac">Create vacancy</button><button class="btn" data-a="go" data-v="assessments">Create assessment</button><button class="btn" data-a="newcamp">Create campaign</button><button class="btn pri" data-a="newiv">Schedule interview</button>`)+
 `<div class="kpis">${k.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="grid g2">
 <div class="card"><h2>Five-round hiring funnel</h2>${bars(fun,n)}</div>
 <div class="card"><h2>Pass rate by round</h2>${bars(pass,100,'tl')}<p class="hint">Share of scored candidates at or above the round threshold.</p></div>
 <div class="card"><h2>Candidates by role</h2>${bars(byRole,Math.max(...byRole.map(x=>x[1])))}</div>
 <div class="card"><h2>Candidates by college</h2>${bars(byCol,Math.max(...byCol.map(x=>x[1])),'tl')}</div>

 <div class="card"><h2>Upcoming interviews</h2>${iv.length?`<div class="list">${iv.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5).map(i=>`<div><span><b>${esc((cand(i.cid)||{}).name)}</b><br><small class="hint">Round ${i.round} with ${esc(i.who)}</small></span><span>${esc(i.date)} ${esc(i.time)}</span></div>`).join('')}</div>`:empty('Nothing scheduled','Scheduled interviews show here.')}</div>
 <div class="card"><h2>Overdue reviews</h2>${over.length?`<div class="list">${over.map(x=>`<div><span><b>${esc(x.name)}</b><br><small class="hint">${esc(x.stage)} submitted ${x.subDays} days ago</small></span><button class="btn sm" data-a="opensc" data-id="${x.id}">Review</button></div>`).join('')}</div>`:empty('No overdue reviews','Reviews waiting more than 3 days appear here.')}</div>
 ${blockedCard()}<div class="card"><h2>Recent activity</h2>${D.audit.length?`<div class="list">${D.audit.slice(0,6).map(a=>`<div><span>${esc(a.text)}<br><small class="hint">${esc(a.who)}</small></span><small class="hint">${esc(a.t)}</small></div>`).join('')}</div>`:empty('No activity yet','Changes are logged here.')}</div></div>`}

/* ---------- candidates ---------- */
function filtered(){const f=state.f,q=(f.q||'').toLowerCase();return visible().filter(c=>(!q||c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))&&(!f.college||c.college===f.college)&&(!f.year||String(c.year)===f.year)&&(!f.degree||c.degree.toLowerCase().includes(f.degree.toLowerCase()))&&(!f.role||c.role===f.role)&&(!f.skill||c.skills.join(' ').toLowerCase().includes(f.skill.toLowerCase()))&&(!f.source||c.source===f.source)&&(!f.stage||c.stage===f.stage)&&(!f.as||astatus(c)===f.as)&&(!f.min||(calc(c,state.cfg).overall||0)>=+f.min)&&(!f.dec||decision(c)===f.dec))}
function candidates(){const f=state.f;const o=(a,k,l)=>`<label class="f">${l}<select data-f="${k}"><option value="">All</option>${a.map(x=>{const v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return`<option value="${esc(v)}"${f[k]===v?' selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
 return head('Candidates','Search, filter and open any candidate record',can('create')?`<button class="btn pri" data-a="go" data-v="candnew">${ic('plus')}Add candidate</button>`:'')+
 `<div class="filters"><label class="f">Name or candidate ID<input data-f="q" value="${esc(f.q||'')}" placeholder="e.g. Aarav or NT-2026-0001"></label>${o(COLLEGES,'college','College')}<label class="f">Degree<input data-f="degree" value="${esc(f.degree||'')}" placeholder="e.g. B.E."></label>${o(['2025','2026','2027'],'year','Graduation year')}${o(ROLES.map(r=>[r.id,r.name]),'role','Applied role')}<label class="f">Skill<input data-f="skill" value="${esc(f.skill||'')}" placeholder="e.g. React"></label>${o(SOURCES,'source','Source')}${o(STAGES,'stage','Current round')}${o(['Not started','In Progress','Under Review','Completed','Closed'],'as','Assessment status')}<label class="f">Min overall score<input data-f="min" type="number" min="0" max="100" value="${esc(f.min||'')}"></label>${o(['Pending','Shortlisted','Selected','On Hold','Rejected'],'dec','Hiring decision')}</div><div id="candTable"></div>`}
function renderCandTable(){const el=$('#candTable');if(!el)return;const s=state.sort;let rows=filtered().map(c=>({c,ov:calc(c,state.cfg)}));
 const key={id:r=>r.c.id,name:r=>r.c.name,college:r=>r.c.college,role:r=>r.c.role,stage:r=>stageIdx(r.c),ov:r=>r.ov.overall==null?-1:r.ov.overall}[s.k]||(r=>r.c.id);rows.sort((a,b)=>{const x=key(a),y=key(b);return(x>y?1:x<y?-1:0)*s.d});
 if(!visible().length){el.innerHTML=`<div class="card">${empty('No candidates yet','Add your first candidate or import from a campaign.',`<button class="btn pri" data-a="go" data-v="candnew">Add candidate</button>`)}</div>`;return}
 if(!rows.length){el.innerHTML=`<div class="card">${empty('No candidates match these filters','Clear a filter to see more.',`<button class="btn" data-a="clearf">Clear filters</button>`)}</div>`;return}
 const th=(k,l)=>`<th data-sort="${k}">${l}${s.k===k?(s.d>0?' ▲':' ▼'):''}</th>`;
 el.innerHTML=`<div class="tw"><table><thead><tr>${th('id','ID')}${th('name','Name')}${th('college','College')}${th('role','Role')}${th('stage','Round')}<th>Assessment</th>${th('ov','Overall')}<th>Decision</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-a="open" data-id="${r.c.id}"><td>${r.c.id}</td><td><b>${esc(r.c.name)}</b></td><td>${esc(r.c.college)}</td><td>${r.c.role}</td><td>${chip(r.c.stage)}</td><td>${chip(astatus(r.c))}</td><td>${fmt(r.ov.overall)}${r.ov.provisional?' <small class="hint">prov.</small>':''}</td><td>${chip(decision(r.c))}</td></tr>`).join('')}</tbody></table></div><p class="hint">${rows.length} of ${visible().length} candidates</p>`}
function nextId(){return'NT-2026-'+pad(D.candidates.length+1,4)}
function candnew(){const E=state.edit,c=E||{};
 return head(E?'Edit candidate':'Add candidate',E?E.id:'Candidate ID is generated automatically',`<button class="btn" data-a="go" data-v="candidates">Cancel</button><button class="btn pri" data-a="savecand">${E?'Save changes':'Create candidate'}</button>`)+

function saveCand(){
 const em=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;let bad=0;
 bad|=setErr('f_name',val('f_name').length<2?'Enter the full name.':'');
 bad|=setErr('f_email',!em.test(val('f_email'))?'Enter a valid email address.':(D.candidates.some(c=>c.email===val('f_email').toLowerCase()&&(!state.edit||c.id!==state.edit.id))?'This email already has a candidate record.':''));
 bad|=setErr('f_phone',!/^[6-9]\d{9}$/.test(val('f_phone').replace(/[\s-]/g,'').replace(/^\+91/,''))?'Enter a 10-digit Indian mobile number.':'');
 const y=+val('f_year');bad|=setErr('f_year',!(y>=2020&&y<=2030)?'Enter a year between 2020 and 2030.':'');
 const rp=val('f_repo');bad|=setErr('f_repo',rp&&!/^https?:\/\/\S+\.\S+/.test(rp)?'Enter a full URL starting with https://':'');
 const rs=document.getElementById('f_resume').files[0];if(rs){bad|=setErr('f_resume',!/\.(pdf|docx)$/i.test(rs.name)?'Only PDF or DOCX files are accepted.':rs.size>5242880?'File is larger than 5 MB.':'')}
 if(bad){toast('Fix the highlighted fields.',1);return}
 const o={name:val('f_name'),email:val('f_email').toLowerCase(),phone:val('f_phone'),city:val('f_city'),college:val('f_college'),degree:val('f_degree'),year:y,cgpa:val('f_cgpa'),role:val('f_role'),skills:val('f_skills').split(',').map(x=>x.trim()).filter(Boolean),exp:val('f_exp'),repo:rp,cert:val('f_cert'),avail:val('f_avail'),comp:val('f_comp'),campaign:val('f_camp'),source:val('f_source'),hr:val('f_hr'),interviewer:val('f_int'),stage:val('f_stage'),notes:val('f_notes'),resume:rs?rs.name:undefined};
 if(state.edit){const c=state.edit;Object.keys(o).forEach(k=>{if(o[k]!==undefined)c[k]=o[k]});audit('Edited candidate record',c.id);toast('Candidate updated.');state.cid=c.id;state.edit=null;go('candidate')}
 else{const c=Object.assign({id:nextId(),scores:[null,null,null,null,null],submitted:false,subDays:0},o);D.candidates.push(c);audit('Created candidate '+c.name,c.id);toast('Candidate '+c.id+' created.');state.cid=c.id;go('candidate')}}

const TABS=['Overview','Personal & Education','Resume & Portfolio','Assessments','Group Projects','Individual Assignments','Interview History','Reviews & Scorecards','Timeline & Audit History','Offers & Joining'];

 if(t==='Overview')b=`${kv([['Applied role',roleName(c.role)],['Current round',c.stage],['Overall score',fmt(k.overall)+(k.provisional?' (provisional, missing rounds not counted as zero)':'')],['Verdict',k.verdict],['Assigned interviewer',c.interviewer],['HR representative',c.hr]])}<div class="sec">Round scores</div>${roundStrip(c)}`;

 if(t==='Interview History'){const iv=D.interviews.filter(i=>i.cid===c.id);b=iv.length?`<div class="list">${iv.map(i=>`<div><span><b>Round ${i.round}</b> with ${esc(i.who)}<br><small class="hint">${i.date} ${i.time}, ${i.dur} min, ${esc(i.mode)}</small></span>${chip(i.status)}</div>`).join('')}</div>`:empty('No interviews','Schedule one from Interviews & Schedule.',`<button class="btn" data-a="newiv" data-id="${c.id}">Schedule interview</button>`)}

 if(t==='Timeline & Audit History'){const a=D.audit.filter(x=>x.cid===c.id);b=a.length?`<div class="list">${a.map(x=>`<div><span>${esc(x.text)}<br><small class="hint">${esc(x.who)}</small></span><small class="hint">${esc(x.t)}</small></div>`).join('')}</div>`:empty('No history yet','Stage changes, reviews and overrides are logged here.')}
 if(t==='Offers & Joining')b=isSel(c)?kv([['Offer status',c.stage==='Selected'?'Not sent':c.stage==='Offer Sent'?'Sent, awaiting response':c.stage==='Offer Accepted'?'Accepted':'Joined'],['Role',roleName(c.role)],['Expected compensation',c.comp],['Joining availability',c.avail]]):empty('No offer yet','Offers are available once a candidate is Selected.');
 return head(c.name,c.id+' · '+roleName(c.role),`<button class="btn" data-a="editcand" data-id="${c.id}">Edit</button><button class="btn" data-a="override" data-id="${c.id}">Change stage</button><button class="btn" data-a="go" data-v="candidates">Back</button>`)+`<div class="row" style="margin-bottom:6px">${chip(c.stage)}${chip(decision(c))}${chip(k.verdict)}</div><div class="tabs" role="tablist">${TABS.map(x=>`<button role="tab" data-a="tab" data-t="${esc(x)}" class="${t===x?'on':''}">${x}</button>`).join('')}</div><div class="card">${b}</div>`}

const ATYPES=['Multiple-choice questions','Multiple-select questions','Short written answers','Long written answers','Logical reasoning','Technical questions','Coding task brief','UI design brief','File-upload assignment','Group project brief','Business role-play','Spreadsheet and data analysis','Interview scorecard'];
function newDraft(){return{id:null,title:'',type:ATYPES[5],round:1,roles:['SDE'],diff:'Medium',time:45,pass:50,attempts:1,eval:'Auto + manual',status:'Draft',ver:1,vh:[],qs:[],rubric:['Accuracy','Clarity'],instr:'',tools:'Browser, notes. No external help.',start:'',end:'',lock:'strict',files:[]}}
function builder(){const d=state.draft;if(!d)return empty('Nothing open','Create or open an assessment from the library.',`<button class="btn" data-a="go" data-v="assessments">Back to library</button>`);
 const bi=(k,l,o)=>`<label class="f ${o&&o.full?'full':''}">${l}${o&&o.sel?`<select data-b="${k}">${o.sel.map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${esc(a[0])}"${String(d[k])===String(a[0])?' selected':''}>${esc(a[1])}</option>`}).join('')}</select>`:o&&o.ta?`<textarea data-b="${k}">${esc(d[k])}</textarea>`:`<input data-b="${k}" type="${o&&o.type||'text'}" value="${esc(d[k])}">`}</label>`;
 const total=d.qs.reduce((s,q)=>s+(+q.m||0),0);
 return head(d.id?d.title||'Assessment':'New assessment','Version '+d.ver+' · '+d.status,`<button class="btn" data-a="go" data-v="assessments">Back</button><button class="btn" data-a="prevdraft">Preview as candidate</button><button class="btn" data-a="savedraft" data-s="Draft">Save draft</button><button class="btn pri" data-a="savedraft" data-s="Active">Publish</button>`)+
 `<div class="card"><div class="form">${bi('title','Title *',{full:1})}${bi('type','Assessment type',{sel:ATYPES})}${bi('round','Hiring round',{sel:[[1,'Round 1 Skills'],[2,'Round 2 Group Project'],[3,'Round 3 Mindset & Reasoning'],[4,'Round 4 Individual Practical'],[5,'Round 5 HR & Founder']]})}${bi('diff','Difficulty',{sel:['Easy','Medium','Hard','n/a']})}${bi('time','Time limit (minutes, 0 for none)',{type:'number'})}${bi('pass','Minimum passing score (%)',{type:'number'})}${bi('attempts','Allowed attempts',{type:'number'})}${bi('lock','Test lock when a candidate leaves the window',{sel:[['strict','Block on first exit (recommended)'],['warn','Two warnings, then block'],['off','Off (log only)']]})}${bi('eval','Evaluation',{sel:['Automatic','Manual','Auto + manual']})}${bi('start','Start date',{type:'date'})}${bi('end','End date',{type:'date'})}<label class="f full">Applicable roles<span class="row">${ROLES.map(r=>`<label class="opt"><input type="checkbox" data-role="${r.id}" ${d.roles.includes(r.id)?'checked':''}>${r.id}</label>`).join('')}</span></label>${bi('instr','Description and instructions',{ta:1,full:1})}${bi('tools','Permitted resources and tools',{full:1})}<label class="f full">Evaluation rubric (comma separated criteria)<input data-b="rubric" value="${esc(d.rubric.join(', '))}"></label><label class="f full">File attachments (briefs and datasets: PDF, DOCX, XLSX, CSV, ZIP, PNG, up to 10 MB each)<input type="file" id="b_files" multiple accept=".pdf,.docx,.xlsx,.csv,.zip,.png,.jpg,.txt"><span class="err" id="b_files_e"></span>${(d.files||[]).length?`<span class="row">${d.files.map(f=>`<span class="chip c-blue">${esc(f)}</span>`).join('')}</span>`:''}</label></div></div>
 <div class="sec">Questions (${d.qs.length}, ${total} marks)</div>${d.qs.map((q,i)=>`<div class="q"><div class="row" style="justify-content:space-between"><b>Question ${i+1}</b><span class="row"><select data-q="${i}" data-k="k" style="width:auto"><option value="mc"${q.k==='mc'?' selected':''}>Multiple choice</option><option value="ms"${q.k==='ms'?' selected':''}>Multiple select</option><option value="sa"${q.k==='sa'?' selected':''}>Short answer</option><option value="la"${q.k==='la'?' selected':''}>Long answer</option><option value="fu"${q.k==='fu'?' selected':''}>File upload</option></select><button class="btn sm dng" data-a="delq" data-i="${i}">Remove</button></span></div><label class="f">Question text<textarea data-q="${i}" data-k="t">${esc(q.t)}</textarea></label>${(q.k==='mc'||q.k==='ms')?`<p class="hint">Mark the correct answer(s). This key is hidden from candidates.</p>${q.o.map((o,j)=>`<div class="opt"><input type="${q.k==='mc'?'radio':'checkbox'}" name="k${i}" data-q="${i}" data-key="${j}" ${q.a.includes(j)?'checked':''}><input data-q="${i}" data-opt="${j}" value="${esc(o)}"></div>`).join('')}<button class="btn sm" data-a="addopt" data-i="${i}">Add option</button>`:'<p class="hint">Scored manually against the rubric.</p>'}<label class="f" style="max-width:120px;margin-top:8px">Marks<input type="number" data-q="${i}" data-k="m" value="${esc(q.m)}"></label></div>`).join('')||`<div class="card">${empty('No questions','Add the first question.')}</div>`}<button class="btn" data-a="addq">${ic('plus')}Add question</button>
 ${d.vh.length?`<div class="sec">Version history</div><div class="list">${d.vh.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}`}

function pipeline(){const c=visible();if(!c.length)return head('Hiring Pipeline','Kanban and table views')+`<div class="card">${empty('Pipeline is empty','Candidates appear here once they apply.')}</div>`;
 const nx=x=>{const iv=D.interviews.find(i=>i.cid===x.id&&i.status==='Scheduled');return iv?'Interview '+iv.date:x.submitted?'Review submission':reached(x)?'Complete Round '+reached(x):'Screen application'};
 const card=x=>{const k=calc(x,state.cfg);return`<div class="kc"><b data-a="open" data-id="${x.id}">${esc(x.name)}</b><span>${esc(x.role)} · score ${fmt(k.overall)}</span><span class="hint">${x.submitted?'Pending evaluation':'No pending evaluation'}</span><span class="hint">${esc(x.interviewer)}</span><span class="hint">Next: ${esc(nx(x))}</span><button class="btn sm" data-a="override" data-id="${x.id}">Move stage</button></div>`};

// Test-lock rules. Pure functions, so the browser prototype, the API and the tests share one definition.
// A web page cannot stop a person opening another tab or app. It can detect that the test window lost
// focus and refuse to continue. The server holds the deadline and the status, so refreshing the page,
// editing client code or going offline does not bring a blocked attempt back.
//
// Attempt statuses: in_progress -> blocked -> ready (HR reinstated) -> in_progress -> submitted
// Lock modes: strict = block on first exit, warn = two warnings then block, off = log only.

const MODES = ['strict', 'warn', 'off'];
const MAX_WARNINGS = 2;

function pxTime(x) { return x instanceof Date ? x.getTime() : new Date(x).getTime(); }

function pxViolation(attempt, mode) {
  const warnings = (attempt && attempt.warnings) || 0;
  if (!attempt || attempt.status !== 'in_progress') return { action: 'ignore', warnings };
  if (!MODES.includes(mode) || mode === 'off') return { action: 'log', warnings };
  if (mode === 'strict') return { action: 'block', warnings: warnings + 1 };
  const w = warnings + 1;
  return w > MAX_WARNINGS ? { action: 'block', warnings: w } : { action: 'warn', warnings: w };
}

function pxRemaining(attempt, now) {
  if (attempt.status === 'in_progress') return Math.max(0, pxTime(attempt.deadline_at) - now);
  return Math.max(0, Number(attempt.remaining_ms) || 0);
}

// Freeze the clock while blocked, so HR can give the candidate back exactly the time they had left.
function pxBlock(attempt, now) {
  return { status: 'blocked', remaining_ms: pxRemaining(attempt, now), blocked_at: now };
}

function pxReinstate(attempt, now, reason) {
  if (attempt.status !== 'blocked') throw new Error('Only a blocked attempt can be reinstated');
  if (!reason || String(reason).trim().length < 5) throw new Error('A reason is required to reinstate an attempt');
  return { status: 'ready', warnings: 0, reinstated_count: (attempt.reinstated_count || 0) + 1, reinstated_at: now };
}

function pxResume(attempt, now) {
  if (!['idle', 'ready'].includes(attempt.status)) throw new Error('This attempt cannot be started');
  return { status: 'in_progress', deadline_at: now + Math.max(0, Number(attempt.remaining_ms) || 0) };
}

// May answers be saved or submitted right now? 5 seconds of grace covers network delay.
function pxCanWrite(attempt, now, graceMs = 5000) {
  if (!attempt) return { ok: false, reason: 'no_attempt' };
  if (attempt.status === 'blocked') return { ok: false, reason: 'blocked' };
  if (attempt.status === 'submitted') return { ok: false, reason: 'already_submitted' };
  if (attempt.status !== 'in_progress') return { ok: false, reason: 'not_started' };
  if (pxTime(attempt.deadline_at) + graceMs < now) return { ok: false, reason: 'time_expired' };
  return { ok: true };
}

// Question import for all five rounds. Accepts CSV or JSON, checks every row, and reports problems by
// row number so an admin can fix the file and retry. Nothing is saved until the admin confirms.
// Excel files: save as CSV first.

const KIND = { mcq: 'mc', multi: 'ms', short: 'sa', long: 'la', scenario: 'la', upload: 'fu' };
const MAX_ROWS = 500;
const MAX_CHARS = 1048576;
const LETTERS = ['A', 'B', 'C', 'D'];

function impParseCsv(text) {
  const rows = []; let row = [], cur = '', quoted = false;
  const s = String(text).replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (quoted) {
      if (ch === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else quoted = false; }
      else cur += ch;
    } else if (ch === '"' && cur === '') quoted = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && s[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return { rows: rows.filter(r => r.some(c => String(c).trim() !== '')), unclosed: quoted };
}

function impNormalizeJson(v) {
  if (!v || typeof v !== 'object') return {};
  const o = {};
  for (const k of Object.keys(v)) o[String(k).toLowerCase()] = Array.isArray(v[k]) ? v[k].join(';') : (v[k] == null ? '' : String(v[k]).trim());
  if (Array.isArray(v.options)) v.options.slice(0, 4).forEach((x, i) => { o['option_' + 'abcd'[i]] = String(x == null ? '' : x).trim(); });
  return o;
}

function impCheckRow(v) {
  const errors = [];
  const round = Number(v.round);
  if (!Number.isInteger(round) || round < 1 || round > 5) errors.push('Round must be 1 to 5');
  const type = String(v.type || '').toLowerCase();
  const k = KIND[type];
  if (!k) errors.push('Type must be one of: ' + Object.keys(KIND).join(', '));
  const t = String(v.question || '').trim();
  if (t.length < 5) errors.push('Question text is missing or too short');
  if (t.length > 2000) errors.push('Question text is longer than 2000 characters');
  const marks = v.marks === '' || v.marks == null ? 1 : Number(v.marks);
  if (!Number.isFinite(marks) || marks <= 0 || marks > 100) errors.push('Marks must be a number from 1 to 100');
  const diff = String(v.difficulty || '').toLowerCase();
  if (diff && !['easy', 'medium', 'hard'].includes(diff)) errors.push('Difficulty must be easy, medium or hard');
  let o = [], a = [];
  if (k === 'mc' || k === 'ms') {
    const opts = [v.option_a, v.option_b, v.option_c, v.option_d].map(x => String(x || '').trim());
    let n = opts.length; while (n > 0 && !opts[n - 1]) n--;
    o = opts.slice(0, n);
    if (o.length < 2) errors.push('Give at least two options (option_a, option_b ...)');
    else if (o.some(x => !x)) errors.push('Fill the options in order without gaps');
    const letters = [...new Set(String(v.correct || '').toUpperCase().match(/[A-D]/g) || [])];
    if (!letters.length) errors.push('Mark the correct answer (A to D)');
    else {
      a = letters.map(l => LETTERS.indexOf(l)).sort();
      if (a.some(i => i >= o.length)) errors.push('The correct answer points to an empty option');
      if (k === 'mc' && a.length !== 1) errors.push('Single-choice questions need exactly one correct answer');
      if (k === 'ms' && a.length < 2) errors.push('Multi-select questions need two or more correct answers');
    }
  }
  return { errors, q: { round, k, t, o, a, m: marks, diff } };
}

function impParse(text, filename) {
  const res = { rows: [], fatal: null, summary: null };
  const s = String(text || '');
  if (!s.trim()) { res.fatal = 'The file is empty.'; return res; }
  if (s.length > MAX_CHARS) { res.fatal = 'The file is larger than 1 MB. Split it into smaller files.'; return res; }
  let recs;
  if (/\.json$/i.test(filename || '') || /^\s*[\[{]/.test(s)) {
    let j; try { j = JSON.parse(s); } catch (e) { res.fatal = 'This is not valid JSON.'; return res; }
    const list = Array.isArray(j) ? j : (j && Array.isArray(j.questions) ? j.questions : null);
    if (!list) { res.fatal = 'JSON must be a list of questions, or an object with a "questions" list.'; return res; }
    recs = list.map((v, i) => ({ line: i + 1, v: impNormalizeJson(v) }));
  } else {
    const p = impParseCsv(s);
    if (p.unclosed) { res.fatal = 'A quoted value is not closed. Look for a missing " in the file.'; return res; }
    const head = p.rows[0].map(h => String(h).trim().toLowerCase().replace(/\s+/g, '_'));
    const miss = ['round', 'type', 'question'].filter(h => !head.includes(h));
    if (miss.length) { res.fatal = 'Missing column(s): ' + miss.join(', ') + '. The first row must be the header.'; return res; }
    recs = p.rows.slice(1).map((r, i) => ({ line: i + 2, v: Object.fromEntries(head.map((h, j) => [h, String(r[j] == null ? '' : r[j]).trim()])) }));
  }
  if (!recs.length) { res.fatal = 'No questions found under the header.'; return res; }
  if (recs.length > MAX_ROWS) { res.fatal = `The file has ${recs.length} questions. The limit is ${MAX_ROWS} per import.`; return res; }
  const seen = new Map();
  for (const { line, v } of recs) {
    const { errors, q } = impCheckRow(v);
    const key = q.round + '|' + q.t.toLowerCase().replace(/\s+/g, ' ');
    if (!errors.length) {
      if (seen.has(key)) errors.push('Duplicate of row ' + seen.get(key));
      else seen.set(key, line);
    }
    res.rows.push({ line, ok: errors.length === 0, errors, q });
  }

function curAtt(){if(!isCand()||!state.ws)return null;const c=portalCand(),a=asmOf(state.ws);if(!c||!a)return null;const att=attOf(c,a.id);return att?{c,a,att}:null}

function preTest(c,a,att){const lk=a.lock||'strict',fs=!!document.fullscreenEnabled;
 return`<div class="card pre"><div class="lockico"><svg viewBox="0 0 48 48"><rect x="10" y="22" width="28" height="20" rx="4" class="f"/><path class="s" d="M16 22v-6a8 8 0 0 1 16 0v6"/><circle cx="24" cy="32" r="3" class="f2"/></svg></div><h1>${esc(a.title)}</h1><p class="hint">${a.qs.length} questions · ${a.time} minutes · ${att&&att.status==='ready'?'You have '+Math.ceil(att.remaining_ms/60000)+' minutes left from your previous attempt':'Timer starts when you press Start'}</p>

 <div class="check"><h3>System check</h3><ul class="sc"><li style="--j:0"><span>${CK}</span>Browser supported</li><li style="--j:1" class="${navigator.onLine?'':'no'}"><span>${navigator.onLine?CK:'!'}</span>Connected to the internet</li><li style="--j:2" class="${fs?'':'no'}"><span>${fs?CK:'!'}</span>${fs?'Full screen available':'Full screen not available here. Tab-switch lock still works.'}</li></ul></div>
 <label class="opt ack"><input type="checkbox" id="ack" data-ack> I have read the rules and I am ready to start.</label>
 <div class="row"><button class="btn" data-a="wsclose">Not now</button><button class="btn pri" id="beginbtn" data-a="begin" data-id="${a.id}" disabled>${att&&att.status==='ready'?'Resume test':'Start test'}</button></div></div>`}
function blockedView(c,a,att){const ev=att.events.filter(e=>e.kind==='violation');
 return`<div class="card blk"><div class="lockico shake"><svg viewBox="0 0 48 48"><rect x="10" y="22" width="28" height="20" rx="4" class="f bad"/><path class="s bad" d="M16 22v-6a8 8 0 0 1 16 0v6"/><path class="s bad" d="M20 28l8 8M28 28l-8 8"/></svg></div><h1>Your test is blocked</h1><p>You left the test window${ev.length?' at <b>'+when(ev[ev.length-1].t)+'</b>':''}, so the test was locked. Your answers up to that moment are saved and sent to HR. Your time is paused.</p>
 <div class="list">${att.events.map(e=>`<div><span>${esc(e.text)}</span><small class="hint">${when(e.t)}</small></div>`).join('')}</div>
 ${att.reviewRequested?'<div class="banner c-green" style="margin-top:12px">Review requested. HR has been notified and will contact you.</div>':'<p class="hint">If this was a mistake, for example a power cut or a system pop-up, ask HR to review it.</p>'}

function submittedView(a,att){return`<div class="card blk"><div class="lockico"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" class="f2 pop"/><path class="s2 dr" d="M15 24l7 7 12-14"/></svg></div><h1>Submission received</h1><p>Your answers for <b>${esc(a.title)}</b> were submitted on ${when(att.submitted_at)}${att.auto_submitted?' when the time ended':''}. Reference ${esc(att.ref||'SUB-10482')}.</p><p class="hint">Written answers will be marked by a reviewer. We will tell you what happens next.</p><button class="btn pri" data-a="wsclose">Back to my page</button></div>`}
function testView(c,a,att){const q=a.qs[att.qi],n=a.qs.length,ans=a.qs.map((_,i)=>answered(a,att,i)),done=ans.filter(Boolean).length,lk=a.lock||'strict';
 const body=(q.k==='mc'||q.k==='ms')?q.o.map((o,j)=>`<label class="opt big"><input type="${q.k==='mc'?'radio':'checkbox'}" name="q${att.qi}" data-qa="${att.qi}" data-qj="${j}" ${(att.answers[att.qi]||[]).includes(j)?'checked':''}><span>${esc(o)}</span></label>`).join(''):q.k==='fu'?`<label class="f">Upload your file (PDF or ZIP, up to 20 MB)<input type="file" data-qf="${att.qi}" accept=".pdf,.zip"></label><span class="err" id="qf_e"></span>${att.answers[att.qi]&&att.answers[att.qi].name?`<p class="chip c-green">Attached: ${esc(att.answers[att.qi].name)}</p>`:''}`:`<textarea data-qt="${att.qi}" style="min-height:180px" placeholder="Type your answer here">${esc(att.answers[att.qi]||'')}</textarea>`;
 return`<div class="tbar"><span class="lockpill">${ic('users')} Secure test${lk==='off'?' (practice)':''}</span><b class="tt">${esc(a.title)}</b><span class="timer" id="timer" aria-live="off">--:--</span></div>
 <div class="meter"><i style="width:${Math.round(done/n*100)}%"></i></div><div class="row" style="justify-content:space-between;margin:6px 0 10px"><small class="hint" id="saved">${att.saved?'Saved '+att.saved:'Answers save automatically'}</small><small class="hint">${done} of ${n} answered${lk==='warn'?' · warnings '+att.warnings+' of 2':''}</small></div>
 <div class="pager">${a.qs.map((_,i)=>`<button class="pg ${i===att.qi?'on':''} ${ans[i]?'ans':''}" data-a="qgo" data-i="${i}" aria-label="Question ${i+1}${ans[i]?', answered':''}">${i+1}</button>`).join('')}</div>
 <div class="card qcard" key="${att.qi}"><small class="hint">Question ${att.qi+1} of ${n} · ${q.m} marks${q.k==='ms'?' · select all that apply':''}</small><h2 style="margin:6px 0 12px;font-size:17px">${esc(q.t)}</h2>${body}</div>
 <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn" data-a="qgo" data-i="${att.qi-1}" ${att.qi===0?'disabled':''}>Previous</button><span class="row">${att.qi<n-1?`<button class="btn pri" data-a="qgo" data-i="${att.qi+1}">Next</button>`:''}<button class="btn ${att.qi<n-1?'':'pri'}" data-a="askSubmit">Submit answers</button></span></div>
 <p class="hint" style="margin-top:14px">Prototype only: <button class="btn sm ghost" data-a="simleave">Simulate leaving the page</button> to see the lock without switching tabs.</p>
 ${att.warnPending?`<div class="modalbg"><div class="modal"><header><h2>Warning ${att.warnings} of 2</h2></header><div><p>You left the test window. Stay on this page for the rest of the test. ${att.warnings>=2?'<b>The next time, your test will be blocked.</b>':'One more warning is allowed.'}</p></div><footer><button class="btn pri" data-a="ackwarn">Continue test</button></footer></div></div>`:''}
 ${att.confirmSubmit?`<div class="modalbg"><div class="modal"><header><h2>Submit your answers?</h2></header><div><p>${n-done?`<b>${n-done} question(s) are unanswered.</b> `:''}You cannot change answers after submitting.</p></div><footer><button class="btn" data-a="cancelSubmit">Keep working</button><button class="btn pri" data-a="doSubmit">Submit now</button></footer></div></div>`:''}`}

/* ----- shell ----- */
function renderPortal(){
 const c=portalCand();const TABS={journey:'My journey',tests:'Tests',project:'Group project',task:'My task',sched:'Interviews',docs:'Documents',notes:'Messages'};
 if(!TABS[state.pt])state.pt='journey';

 const shell=b=>`<div class="top"><span class="logo">N</span><b>Semil Careers</b><span class="grow"></span>${D.candidates.length?pick:''}<button class="btn sm ghost" data-a="umenu">${avatar(c?c.name:'C')}<span class="hide-s">${c?esc(c.name):'Candidate'}</span></button></div>${state.menu?menuHtml():''}<div class="content"><div class="pshell">${b}</div></div>`;
 if(!c){$('#app').innerHTML=shell(`<div class="card">${empty('No application yet','Create your profile and apply for an open role.')}</div>`);return}
 if(state.loading){$('#app').innerHTML=shell('<div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>');return}
 const ci=curAtt();
 if(ci&&state.ws){const{a,att}=ci;let v;
  if(att.status==='in_progress')v=testView(c,a,att);else if(att.status==='blocked')v=blockedView(c,a,att);else if(att.status==='submitted')v=submittedView(a,att);else v=preTest(c,a,att);
  $('#app').innerHTML=`<div class="content secure"><div class="pshell">${v}</div></div>`;
  if(att.status==='in_progress')startTimer();return}
 if(state.ws){const a=asmOf(state.ws);$('#app').innerHTML=`<div class="content secure"><div class="pshell">${preTest(c,a,null)}</div></div>`;return}
 const cur=jpos(c),sel=state.pstage==null?Math.min(cur,7):state.pstage,pct=Math.round(Math.min(cur,8)/8*100);

 let b='';
 if(state.pt==='journey')b=`<div class="card jcard">${journey(c)}</div><div class="jgrid"><div>${stagePanel(c,sel)}</div>${sideCards(c)}</div>${timeline(c)}`;
 else b={tests:testsTab,project:projectTab,task:taskTab,sched:schedTab,docs:docsTab,notes:notesTab}[state.pt](c);
 $('#app').innerHTML=shell(`<div class="hello"><div><h1>Hi ${esc(c.name.split(' ')[0])}, here is where you are</h1><p class="hint">${esc(roleName(c.role))} · ${esc(c.id)}</p></div><div class="row"><span class="chip c-${stopped(c)?(c.stage==='Rejected'?'gray':'amber'):'blue'}">${stopped(c)?c.stage:cur>=8?'Joined':'Step '+(Math.min(cur,7)+1)+' of 8'}</span><span class="pct">${pct}%</span></div></div><div class="demo" style="margin:0 0 10px;border-radius:8px">Prototype candidate view with mock data. Uploads here are not stored.</div>${tabs}${b}`);
}
let timerH=null;
function startTimer(){clearInterval(timerH);const f=()=>{const ci=curAtt();const e=document.getElementById('timer');if(!ci||ci.att.status!=='in_progress'||!e){clearInterval(timerH);return}const s=Math.max(0,Math.round((ci.att.deadline_at-Date.now())/1000));e.textContent=pad(Math.floor(s/60),2)+':'+pad(s%60,2);e.classList.toggle('low',s<300);if(s<=0){clearInterval(timerH);submitAttempt(true)}};f();timerH=setInterval(f,1000)}

/* ----- lock engine ----- */
let lockOn=false,fsWanted=false,lastV=0,blurT=null;
function armLock(){if(lockOn)return;lockOn=true;document.addEventListener('visibilitychange',onVis);window.addEventListener('blur',onBlur);document.addEventListener('fullscreenchange',onFs);['copy','cut','paste','contextmenu','dragstart'].forEach(e=>document.addEventListener(e,stopEv,true));window.addEventListener('beforeunload',onUnload)}
function disarmLock(){if(!lockOn)return;lockOn=false;document.removeEventListener('visibilitychange',onVis);window.removeEventListener('blur',onBlur);document.removeEventListener('fullscreenchange',onFs);['copy','cut','paste','contextmenu','dragstart'].forEach(e=>document.removeEventListener(e,stopEv,true));window.removeEventListener('beforeunload',onUnload);clearTimeout(blurT)}
function exitFs(){fsWanted=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
function onVis(){if(document.hidden)violate('Switched to another tab or minimised the window')}
function onBlur(){clearTimeout(blurT);blurT=setTimeout(()=>{if(lockOn&&!document.hasFocus())violate('Moved away from the test window')},400)}
function onFs(){if(lockOn&&fsWanted&&!document.fullscreenElement)violate('Exited full screen')}
function onUnload(e){e.preventDefault();e.returnValue=''}
function stopEv(e){const ci=curAtt();if(!ci)return;e.preventDefault();ci.att.events.push({t:Date.now(),kind:'note',text:'Blocked a '+e.type+' attempt'})}
function violate(reason){const ci=curAtt();if(!ci||ci.att.status!=='in_progress')return;const now=Date.now();if(now-lastV<800)return;lastV=now;const{c,a,att}=ci;const r=pxViolation(att,a.lock||'strict');att.events.push({t:now,kind:'violation',text:reason});
 if(r.action==='block'){Object.assign(att,pxBlock(att,now));att.warnings=r.warnings;disarmLock();exitFs();clearInterval(timerH);D.notifs.unshift({t:`${c.name}'s test "${a.title}" was blocked: ${reason}`,n:1});audit('Test blocked for '+c.name+': '+reason,c.id)}
 else if(r.action==='warn'){att.warnings=r.warnings;att.warnPending=true;D.notifs.unshift({t:`${c.name} received warning ${r.warnings} of 2 during "${a.title}"`,n:1})}
 else att.warnings=r.warnings;
 render()}
function autoMark(a,ans){let got=0,tot=0;a.qs.forEach((q,i)=>{if(q.k==='mc'||q.k==='ms'){tot+=+q.m||0;const r=ans[i]||[];if(r.length&&r.slice().sort().join()===q.a.slice().sort().join())got+=+q.m||0}});return{got,tot}}
function submitAttempt(auto){const ci=curAtt();if(!ci)return;const{c,a,att}=ci;const w=pxCanWrite(att,Date.now(),auto?60000:5000);if(!w.ok&&!auto)return;att.status='submitted';att.submitted_at=Date.now();att.auto_submitted=!!auto;att.remaining_ms=0;att.auto=autoMark(a,att.answers);att.ref='SUB-'+Math.floor(Math.random()*90000+10000);att.confirmSubmit=false;c.submitted=true;c.subDays=0;att.events.push({t:Date.now(),kind:'note',text:auto?'Time ended: answers submitted automatically':'Submitted answers'});disarmLock();exitFs();clearInterval(timerH);D.notifs.unshift({t:`${c.name} submitted "${a.title}"`,n:1});audit('Submitted '+a.title+(auto?' (time ended)':''),c.id);render()}
async function beginTest(id){const c=portalCand(),a=asmOf(id);if(!c||!a)return;const att=ensureAtt(c,a);const box=document.getElementById('ack');if(!box||!box.checked)return;if(!['idle','ready'].includes(att.status))return;
 Object.assign(att,pxResume(att,Date.now()));att.events.push({t:Date.now(),kind:'start',text:att.reinstated_count?'Resumed after reinstatement':'Started the test'});state.ws=id;
 if((a.lock||'strict')!=='off'){armLock();try{await document.documentElement.requestFullscreen();fsWanted=true}catch(e){att.events.push({t:Date.now(),kind:'note',text:'Full screen was not available. Tab-switch lock is active.'})}}
 render()}

/* ---------- HR side: test sessions, blocked tests, question import and bank ---------- */

function assessTab(c){

 if(!as.length)return empty('No assessments assigned','Assign an assessment from the library, or the candidate has not reached a test round yet.');

 return t+logs}

 if(t.dataset.b){const k=t.dataset.b;state.draft[k]=k==='rubric'?t.value.split(',').map(x=>x.trim()).filter(Boolean):['time','pass','attempts','round'].includes(k)?+t.value:t.value}
 if(t.dataset.q!==undefined&&t.dataset.k&&t.tagName!=='SELECT'){const q=state.draft.qs[+t.dataset.q];q[t.dataset.k]=t.dataset.k==='m'?+t.value:t.value}
 if(t.dataset.opt!==undefined)state.draft.qs[+t.dataset.q].o[+t.dataset.opt]=t.value;
 if(t.dataset.gm!==undefined){D.groups.find(x=>x.id===state.gid).members[+t.dataset.gm].resp=t.value}
 if(t.dataset.w!==undefined&&state.view==='settings'){state.cfg.w[+t.dataset.w]=+t.value||0;const s=state.cfg.w.reduce((a,b)=>a+b,0),e=document.getElementById('wsum');e.textContent='Total '+s+'%';e.className='chip c-'+(s===100?'green':'red')}
 if(t.dataset.t!==undefined)state.cfg.t[+t.dataset.t]=+t.value||0;
 if(t.dataset.target!==undefined)state.cfg.target=+t.value||0;
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f!==undefined){state.f[t.dataset.f]=t.value;renderCandTable()}
 if(t.dataset.role){const r=state.draft.roles,i=r.indexOf(t.dataset.role);if(t.checked&&i<0)r.push(t.dataset.role);if(!t.checked&&i>=0)r.splice(i,1)}
 if(t.dataset.q!==undefined&&t.dataset.k==='k'){const q=state.draft.qs[+t.dataset.q];q.k=t.value;q.a=[];if((t.value==='mc'||t.value==='ms')&&!q.o.length)q.o=['','','',''];render()}
 if(t.dataset.key!==undefined){const q=state.draft.qs[+t.dataset.q],j=+t.dataset.key;if(q.k==='mc')q.a=[j];else{const i=q.a.indexOf(j);if(t.checked&&i<0)q.a.push(j);if(!t.checked&&i>=0)q.a.splice(i,1)}}
 if(t.dataset.sc){if(t.dataset.sc==='cid')state.sc.cid=t.value;else state.sc.round=+t.value;render()}
 if(t.dataset.rate){const k=(state.sc.cid||visible()[0].id)+state.sc.round;(state.sc.r[k]=state.sc.r[k]||{})[t.dataset.rate]=t.value;render()}
 if(t.dataset.rep){state.rep[t.dataset.rep]=t.value;render()}
 if(t.dataset.a==='gtask'){const g=D.groups.find(x=>x.id===state.gid);g.tasks[+t.dataset.i].d=t.checked?1:0;audit('Updated checklist in '+g.name)}
});
document.addEventListener('click',e=>{const th=e.target.closest('th[data-sort]');if(th){const k=th.dataset.sort;state.sort=state.sort.k===k?{k,d:-state.sort.d}:{k,d:1};renderCandTable()}});
document.addEventListener('submit',e=>{if(e.target.id==='gs'){e.preventDefault();state.f={q:val('gq')};go('candidates')}});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==state.view&&!isCand()&&{dashboard,candidates,jobs,campaigns,assessments,groups,pipeline,interviews,scorecards,offers,reports,notifications,users,settings}[v]){state.view=v;render()}});
{const h=location.hash.slice(1);if(['dashboard','candidates','jobs','campaigns','assessments','groups','pipeline','interviews','scorecards','offers','reports','notifications','users','settings'].includes(h))state.view=h}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,id=t.dataset.id,d=t.dataset;
 const B={
 pretest:()=>{state.ws=id;state.menu=false;render()},
 begin:()=>beginTest(id),
 wsclose:()=>{state.ws=null;disarmLock();exitFs();clearInterval(timerH);render()},
 qgo:()=>{const ci=curAtt();if(!ci||ci.att.status!=='in_progress')return;ci.att.qi=Math.max(0,Math.min(ci.a.qs.length-1,+d.i));render()},
 askSubmit:()=>{const ci=curAtt();if(!ci)return;ci.att.confirmSubmit=true;render()},
 cancelSubmit:()=>{const ci=curAtt();if(!ci)return;ci.att.confirmSubmit=false;render()},
 doSubmit:()=>submitAttempt(false),
 simleave:()=>violate('Simulated: switched to another tab'),
 ackwarn:()=>{const ci=curAtt();if(!ci)return;ci.att.warnPending=false;render()},
 askreview:()=>{const ci=curAtt();if(!ci)return;ci.att.reviewRequested=true;D.notifs.unshift({t:`${ci.c.name} asked for a review of a blocked test`,n:1});audit('Requested review of blocked test',ci.c.id);toast('HR has been notified.');render()},
 pstage:()=>{state.pstage=+d.i;render()},
 opentab:()=>{state.cid=id;state.tab=d.t;go('candidate')},
 reinst:()=>{if(!['SA','HR'].includes(RC[state.role])){toast('Only HR or the Super Admin can reinstate a test.',1);return}confirmReason('Reinstate this test','The candidate gets back the time they had left and must accept the rules again before resuming. Your reason is stored in the audit trail.',`data-a="doreinst" data-id="${id}" data-aid="${d.aid}"`,'Reinstate test')},
 doreinst:()=>{const r=val('m_reason');if(setErr('m_reason',r.length<5?'Enter a reason of at least 5 characters.':''))return;const c=cand(id),at=attOf(c,d.aid);try{Object.assign(at,pxReinstate(at,Date.now(),r))}catch(x){toast(x.message,1);return}at.reviewRequested=false;at.events.push({t:Date.now(),kind:'note',text:'Reinstated by '+me()+': '+r});audit(`Reinstated test "${asmOf(d.aid).title}" for ${c.name}. Reason: ${r}`,c.id);closeModal();toast('Reinstated. '+c.name.split(' ')[0]+' can resume with '+Math.ceil(at.remaining_ms/60000)+' minutes left.');render()},
 impopen:()=>impOpen(),
 imptpl:()=>{const ta=document.getElementById('imp_text');if(ta){ta.value=IMP_TEMPLATE;imp.name='example.csv'}},
 impcopy:()=>{(navigator.clipboard?navigator.clipboard.writeText(IMP_TEMPLATE):Promise.reject()).then(()=>toast('Example copied.')).catch(()=>toast('Select the example text and copy it.',1))},
 impcheck:()=>{const ta=document.getElementById('imp_text');imp.text=ta?ta.value:'';const res=impParse(imp.text,imp.name);if(res.fatal){document.getElementById('imp_err').textContent=res.fatal;return}imp.res=res;impRender()},
 impback:()=>{imp.res=null;impRender()},
 impcommit:()=>impCommit(),
 qbr:()=>{state.qbr=+d.r;render()},
 plink:()=>{const c=portalCand(),g=D.groups.find(g=>g.members.some(m=>m.cid===c.id)),l=val('pl_link'),er=document.getElementById('pl_link_e');if(!/^https?:\/\/\S+\.\S+/.test(l)){er.textContent='Enter a full link starting with https://';return}g.links.push(l);audit('Added team link',c.id);toast('Link added.');render()},
 rmdoc:()=>{const c=portalCand();docsOf(c).splice(+d.i,1);render()},
 ptask:()=>{const c=portalCand(),l=val('p_link'),f=state.pendingTask;if(!l&&!f){setErr('p_link','Add a link or upload a file.');return}if(l&&!/^https?:\/\/\S+\.\S+/.test(l)){setErr('p_link','Enter a full link starting with https://');return}c.subs=[{name:f?f.name:'',size:f?f.size:0,at:new Date().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),link:l}];c.submitted=true;c.subDays=0;state.pendingTask=null;D.notifs.unshift({t:`${c.name} submitted the Round 4 task`,n:1});audit('Submitted Round 4 task',c.id);toast('Task submitted.');render()},
 offeraccept:()=>openModal('Accept your offer',`<p>You are accepting the offer for <b>${esc(roleName(portalCand().role))}</b>. HR will confirm your joining date.</p>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="dooffer" data-s="Offer Accepted">Accept offer</button>`),
 offerdecline:()=>openModal('Decline the offer',`<p>Are you sure? HR will be told and may contact you to understand your decision.</p>`,`<button class="btn" data-a="close">Keep offer</button><button class="btn dng" data-a="dooffer" data-s="On Hold">Decline offer</button>`),
 dooffer:()=>{const c=portalCand(),acc=d.s==='Offer Accepted';c.stage=d.s;audit(acc?'Accepted the offer':'Declined the offer',c.id);D.notifs.unshift({t:`${c.name} ${acc?'accepted':'declined'} the offer`,n:1});closeModal();state.pstage=null;toast(acc?'Offer accepted. Welcome to Semil.':'Your response was sent to HR.');render()}
 };
 if(B[a])B[a]()});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.qt!==undefined){const ci=curAtt();if(!ci||ci.att.status!=='in_progress')return;ci.att.answers[+t.dataset.qt]=t.value;stamp(ci.att)}});
function stamp(att){att.saved=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});const s=document.getElementById('saved');if(s)s.textContent='Saved '+att.saved}
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.pc!==undefined){state.pcid=t.value;state.pstage=null;state.pt='journey';state.ws=null;disarmLock();exitFs();render();return}
 if(t.dataset.ack!==undefined){const b=document.getElementById('beginbtn');if(b)b.disabled=!t.checked;return}
 if(t.dataset.qa!==undefined){const ci=curAtt();if(!ci||ci.att.status!=='in_progress')return;const i=+t.dataset.qa,j=+t.dataset.qj,q=ci.a.qs[i];let v=ci.att.answers[i]||[];if(q.k==='mc')v=[j];else{v=v.slice();const p=v.indexOf(j);if(t.checked&&p<0)v.push(j);if(!t.checked&&p>=0)v.splice(p,1)}ci.att.answers[i]=v;stamp(ci.att);return}
 if(t.dataset.qf!==undefined){const ci=curAtt();if(!ci||ci.att.status!=='in_progress')return;const f=t.files[0];if(!f)return;const x='.'+f.name.split('.').pop().toLowerCase(),er=document.getElementById('qf_e');if(!['.pdf','.zip'].includes(x)){er.textContent='Only PDF or ZIP files are accepted.';return}if(f.size>20971520){er.textContent='The file is larger than 20 MB.';return}ci.att.answers[+t.dataset.qf]={name:f.name,size:f.size};stamp(ci.att);render();return}
 if(t.dataset.gtask!==undefined){const c=portalCand(),g=D.groups.find(g=>g.members.some(m=>m.cid===c.id));if(g){g.tasks[+t.dataset.gtask].d=t.checked?1:0;render()}return}
 if(t.dataset.up){const f=t.files[0];if(f)handleUpload(t.dataset.up,f);return}
 if(t.id==='imp_file'){const f=t.files[0];if(!f)return;const er=document.getElementById('imp_err');if(!/\.(csv|json|txt)$/i.test(f.name)){er.textContent='Use a .csv or .json file. Save Excel files as CSV first.';return}if(f.size>1048576){er.textContent='The file is larger than 1 MB.';return}er.textContent='';const r=new FileReader();r.onload=()=>{imp.text=String(r.result);imp.name=f.name;const ta=document.getElementById('imp_text');if(ta)ta.value=imp.text;const nm=document.getElementById('imp_name');if(nm)nm.textContent=f.name+' loaded. Press Check file.'};r.onerror=()=>{er.textContent='The file could not be read.'};r.readAsText(f);return}
 if(t.id==='b_files'){const ok=['.pdf','.docx','.xlsx','.csv','.zip','.png','.jpg','.txt'],names=[];let m='';[...t.files].forEach(f=>{const x='.'+f.name.split('.').pop().toLowerCase();if(!ok.includes(x))m='Not allowed: '+f.name;else if(f.size>10485760)m=f.name+' is larger than 10 MB';else names.push(f.name)});state.draft.files=(state.draft.files||[]).concat(names);render();if(m)setErr('b_files',m)}
});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleUpload(z.dataset.drop,f)});

render();
</script>
