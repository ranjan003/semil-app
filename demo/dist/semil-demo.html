<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semil Talent Demo</title>
<style>:root{--brand:#16304f;--brand-2:#2b5c8a;--accent:#0b8f94;--bg:#f2f5f8;--card:#fff;--ink:#17202b;--muted:#5d6b7a;--line:#dde3ea;--ok:#1b7f4b;--okbg:#e6f4ec;--warn:#a65b00;--warnbg:#fff3df;--bad:#b3261e;--badbg:#fdeceb;--info:#1f5fa8;--infobg:#e8f1fb;--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}h1{font-size:1.45rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
p{margin:.25rem 0 .75rem}a{color:var(--brand-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7aa9d8;outline-offset:2px}
.topbar{background:var(--brand);color:#fff;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;position:sticky;top:0;z-index:20}
.topbar .brand{font-weight:700;letter-spacing:.2px}.topbar .sp{flex:1}.topbar .who{font-size:.85rem;opacity:.9}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:.3rem .7rem;cursor:pointer}
.tabs{display:flex;gap:.25rem;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 .75rem;position:sticky;top:46px;z-index:15}
.tabs button{border:0;background:none;padding:.8rem .9rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:1rem;margin-bottom:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.sp{flex:1}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.5rem .9rem;cursor:pointer;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{background:#f0f4f8}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--bad);border-color:#e7b4b0}.btn.small{padding:.25rem .6rem;min-height:32px;font-size:.85rem}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.75rem}.field label,.field .lbl{font-weight:600;font-size:.88rem}
.field input,.field select,.field textarea{border:1px solid #c5ced8;border-radius:8px;padding:.5rem .6rem;background:#fff;width:100%;min-height:40px}
.field textarea{min-height:90px;resize:vertical}.field .hint{color:var(--muted);font-size:.8rem}.field .err{color:var(--bad);font-size:.82rem}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.chip{display:inline-block;border-radius:999px;padding:.1rem .6rem;font-size:.78rem;background:#e9eef4;color:#35455a;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}
.banner{border-radius:8px;padding:.6rem .8rem;margin:.5rem 0;border:1px solid}
.banner.ok{background:var(--okbg);border-color:#b7dfc9}.banner.warn{background:var(--warnbg);border-color:#f0d3a1}.banner.bad{background:var(--badbg);border-color:#f0b9b5}.banner.info{background:var(--infobg);border-color:#b8d3ef}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#f8fafc}
td.q{max-width:420px}.muted{color:var(--muted)}.small{font-size:.85rem}.mono{font-family:ui-monospace,Menlo,monospace}
.pager{display:flex;gap:.5rem;align-items:center;justify-content:flex-end;margin-top:.75rem}
.toast{background:#17202b;color:#fff;padding:.6rem .9rem;border-radius:8px;margin-top:.5rem;box-shadow:var(--sh);max-width:min(92vw,420px)}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:100;display:flex;flex-direction:column;align-items:flex-end}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh .75rem;overflow:auto;z-index:60}
.modal{background:#fff;border-radius:12px;width:min(760px,100%);padding:1.1rem;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin-bottom:.75rem}
.login{max-width:380px;margin:12vh auto;padding:0 1rem}
.stat{display:flex;gap:.4rem;flex-wrap:wrap}.stat .chip{font-size:.85rem;padding:.2rem .7rem}
.dz{border:2px dashed #b9c6d4;border-radius:12px;padding:1.4rem;text-align:center;background:#fbfcfe}.dz.on{background:var(--infobg);border-color:var(--info)}
.opt{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin:.5rem 0;cursor:pointer;background:#fff}
.opt:hover{background:#f6f9fc}.opt.sel{border-color:var(--brand-2);background:#eef5fc}.opt input{margin-top:.25rem;width:1.1rem;height:1.1rem}
.test{display:grid;grid-template-columns:1fr 250px;gap:1rem}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:.4rem}
.nav button{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:40px;cursor:pointer}
.nav button.done{background:var(--okbg);border-color:#a6d6bd}.nav button.cur{outline:3px solid var(--brand-2)}.nav button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;padding:.2rem .7rem;border-radius:8px;background:#fff;color:var(--brand)}.timer.low{background:var(--badbg);color:var(--bad)}
.progress{height:8px;background:#e3e9f0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.teststrip{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;gap:.8rem;align-items:center;padding:.5rem 1rem;flex-wrap:wrap}
.save{font-size:.8rem;opacity:.9}
@media(max-width:820px){
 .test{grid-template-columns:1fr}.test aside{order:-1}
 table.cards thead{display:none}table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
 table.cards tr{border:1px solid var(--line);border-radius:10px;margin:.5rem 0;padding:.4rem .6rem;background:#fff}
 table.cards td{border:0;padding:.2rem 0}table.cards td::before{content:attr(data-label);display:block;font-size:.7rem;text-transform:uppercase;color:var(--muted)}
 td.q{max-width:none}.tabs{top:46px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* camera and microphone live check (preview only; nothing is recorded) */
.cam-box{position:fixed;right:12px;bottom:12px;z-index:30;width:132px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.cam-video{display:block;width:100%;height:99px;object-fit:cover;background:#111;transform:scaleX(-1)}
.cam-cap{display:flex;align-items:center;gap:.35rem;padding:.25rem .4rem;font-size:.68rem;line-height:1.2;color:var(--muted)}
.cam-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.cam-box.bad .cam-dot{background:var(--bad)}
@media (max-width:600px){.cam-box{width:96px;bottom:68px}.cam-video{height:72px}}
.consent{border:1px solid var(--line);background:var(--infobg);color:var(--ink);border-radius:var(--r);padding:.75rem 1rem;margin:.75rem 0}
.consent ul{margin:.4rem 0 0;padding-left:1.1rem}

/* ---- interface refresh: softer cards, pill tabs, teal accents ---- */
body{letter-spacing:.005em}
h1{font-size:1.55rem;letter-spacing:-.01em}h2{letter-spacing:-.005em}
.topbar{background:linear-gradient(100deg,#12294529 0,#16304f 0),linear-gradient(100deg,#16304f,#1d4a73);border-bottom:3px solid var(--accent);padding:.65rem 1rem}
.topbar .brand{display:inline-flex;align-items:center;gap:.55rem;font-size:1.02rem}
.topbar .brand::before{content:"";width:14px;height:14px;border-radius:4px 10px 4px 10px;background:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.topbar button{border-radius:999px;padding:.3rem .9rem;transition:background .15s}.topbar button:hover{background:rgba(255,255,255,.14)}
.tabs{gap:.35rem;padding:.45rem .75rem;border-bottom:1px solid var(--line);top:52px}
.tabs button{border:0;border-radius:999px;padding:.45rem .95rem;font-weight:500;transition:background .15s,color .15s}
.tabs button:hover{background:#eaf0f6;color:var(--brand)}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff;font-weight:600;border:0}
.card{box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);border-color:#e3e8ee}
.btn{border-radius:10px;font-weight:500;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:#b9c6d4}
.btn.primary{background:linear-gradient(180deg,#1c3b60,var(--brand));box-shadow:0 1px 2px rgba(16,24,40,.2)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.danger:hover{background:var(--badbg)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,143,148,.18)}
:focus-visible{outline-color:var(--accent)}
.chip{border:1px solid rgba(0,0,0,.05);font-weight:500}
table tbody tr{transition:background .12s}table tbody tr:hover{background:#f7fafc}
th{border-bottom:2px solid var(--line)}
.modal{border-radius:16px}
.login{background:var(--card);border:1px solid #e3e8ee;border-radius:18px;padding:1.6rem 1.5rem;box-shadow:0 12px 40px rgba(16,24,40,.12);margin:9vh auto}
.login h1{display:flex;align-items:center;gap:.6rem}.login h1::before{content:"";flex:none;width:18px;height:18px;border-radius:5px 12px 5px 12px;background:var(--accent)}
.opt{border-radius:12px;transition:border-color .12s,background .12s}.opt.sel{border-color:var(--accent);background:#e9f6f6}
.nav button.cur{outline-color:var(--accent)}.teststrip{background:linear-gradient(100deg,#16304f,#1d4a73);border-bottom:3px solid var(--accent)}
.progress i{background:linear-gradient(90deg,var(--accent),#2bb3b8)}
.dz{background:#f8fbfc;border-color:#a9c3cc}
@media(max-width:820px){.tabs{top:50px}}

#demo-bar{display:flex;gap:.75rem;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff7e0;color:#5a4300;border-bottom:1px solid #f0d98a;padding:.4rem 1rem;font-size:.85rem;text-align:center}
#demo-bar button{font:inherit;padding:.15rem .6rem;border:1px solid #c9a63c;background:#fff;border-radius:6px;cursor:pointer;color:#5a4300}
.demo-quick{margin-top:1.25rem;border-top:1px solid #e3e6ec;padding-top:1rem}
.demo-quick h3{font-size:.95rem;margin:0 0 .5rem}
.demo-quick .qk{display:flex;flex-wrap:wrap;gap:.4rem}
.demo-quick button{font:inherit;font-size:.85rem;padding:.35rem .7rem;border:1px solid #c6ccd8;background:#fff;border-radius:8px;cursor:pointer}
.demo-quick button:hover{background:#f1f4f9}
.demo-quick p{font-size:.8rem;color:#5b6577;margin:.5rem 0 0}
</style>
</head>

  var label = { super_admin: 'Super Admin', hr_admin: 'HR', candidate: 'Candidate' };
  function addQuick() {
    var form = document.querySelector('.login form'); if (!form || document.querySelector('.demo-quick')) return;
    var box = document.createElement('div'); box.className = 'demo-quick';
    var h = document.createElement('h3'); h.textContent = 'Try it as:'; box.append(h);
    var row = document.createElement('div'); row.className = 'qk'; box.append(row);
    window.__demo.accounts.forEach(function (a) {
      var bt = document.createElement('button'); bt.type = 'button'; bt.textContent = a.full_name + ' (' + label[a.role] + ')';
      bt.onclick = function () { document.getElementById('email').value = a.email; document.getElementById('password').value = 'demo'; form.requestSubmit(); };
      row.append(bt);
    });
    var p = document.createElement('p'); p.textContent = 'Password for every demo account: demo. Suggested path: HR imports questions, builds and publishes a test, assigns Asha, then sign in as Asha to take it.'; box.append(p);
    form.parentNode.append(box);
  }
  new MutationObserver(addQuick).observe(document.getElementById('root'), { childList: true, subtree: true }); addQuick();
})();
</script>
</body>
